<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log in | VicThree Defence Course</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="assets/shield-32.png">
<link rel="apple-touch-icon" href="assets/shield-180.png">
<meta name="theme-color" content="#0B1F3A">
<link rel="stylesheet" href="assets/portal.css">
</head>
<body>

<header class="site-header">
  <div class="banner-wrap">
    <a href="index.html" class="banner-link" aria-label="VicThree Defence"><img src="assets/banner.jpg" alt="VicThree Defence — by Anmol Sharma"></a>
  </div>
</header>

<main class="auth">
  <div class="auth-card">

    <!-- Step 1: email -->
    <div id="step-email">
      <h1>Welcome back</h1>
      <p class="sub">Enter the email you enrolled with and we'll send you a login code.</p>
      <div id="msg1"></div>
      <label for="email">Email address</label>
      <input class="field" type="email" id="email" autocomplete="email" placeholder="you@example.com">
      <button class="btn primary" id="btn-send">Send me a code</button>
    </div>

    <!-- Step 2: code -->
    <div id="step-code" class="hide">
      <h1>Enter your code</h1>
      <p class="sub">We sent a 6-digit code to <b id="sent-to"></b>. It's valid for 10 minutes.</p>
      <div id="msg2"></div>
      <label for="code">6-digit code</label>
      <input class="field" type="text" id="code" inputmode="numeric" maxlength="6" placeholder="______">
      <button class="btn primary" id="btn-verify">Log in</button>
      <span class="back" id="back-email">Use a different email</span>
    </div>

  </div>
</main>

<footer class="site-footer">VicThree Defence · Course</footer>

<script src="assets/portal.js"></script>
<script>
  // Already logged in? Go straight to the dashboard.
  if (getToken()) location.href = "dashboard.html";

  var emailEl = document.getElementById("email");
  var codeEl  = document.getElementById("code");

  function show(el, cls, text){ el.innerHTML = text ? '<div class="msg '+cls+'">'+text+'</div>' : ''; }

  document.getElementById("btn-send").addEventListener("click", async function(){
    var email = emailEl.value.trim();
    if (!email) { show(document.getElementById("msg1"),"err","Please enter your email."); return; }
    this.disabled = true; this.textContent = "Sending…";
    var r = await api("/api/request-code", { method:"POST", body:{ email:email }, guard:false });
    this.disabled = false; this.textContent = "Send me a code";
    // Always advance — we don't reveal whether the email is enrolled.
    document.getElementById("sent-to").textContent = email;
    document.getElementById("step-email").classList.add("hide");
    document.getElementById("step-code").classList.remove("hide");
    codeEl.focus();
  });

  document.getElementById("btn-verify").addEventListener("click", async function(){
    var code = codeEl.value.trim();
    if (!/^\d{6}$/.test(code)) { show(document.getElementById("msg2"),"err","Enter the 6-digit code."); return; }
    this.disabled = true; this.textContent = "Checking…";
    var r = await api("/api/verify", { method:"POST", body:{ email:emailEl.value.trim(), code:code }, guard:false });
    this.disabled = false; this.textContent = "Log in";
    if (r && r.ok && r.data && r.data.token) {
      setToken(r.data.token);
      location.href = "dashboard.html";
    } else {
      show(document.getElementById("msg2"),"err","That code is wrong or expired. Please check and try again.");
    }
  });

  document.getElementById("back-email").addEventListener("click", function(){
    document.getElementById("step-code").classList.add("hide");
    document.getElementById("step-email").classList.remove("hide");
    show(document.getElementById("msg2"),"", "");
  });

  codeEl && codeEl.addEventListener("keydown", function(e){ if(e.key==="Enter") document.getElementById("btn-verify").click(); });
  emailEl && emailEl.addEventListener("keydown", function(e){ if(e.key==="Enter") document.getElementById("btn-send").click(); });
</script>
</body>
</html>
