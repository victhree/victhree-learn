<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Doubts | VicThree Defence</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="assets/shield-32.png">
<link rel="apple-touch-icon" href="assets/shield-180.png">
<meta name="theme-color" content="#0B1F3A">
<link rel="stylesheet" href="assets/portal.css">
</head>
<body>

<header class="site-header">
  <div class="banner-wrap">
    <a href="doubts.html" class="banner-link" aria-label="VicThree Defence"><img src="assets/banner.jpg" alt="VicThree Defence — by Anmol Sharma"></a>
    <a class="hdr-action" id="forget">Forget key</a>
  </div>
</header>

<main class="wrap admin">

  <!-- Ask for the admin key once; stored only in this browser. -->
  <div class="card" id="keycard">
    <h2>Doubts access</h2>
    <p class="muted" style="font-family:var(--sans);font-size:.9rem">Enter your admin key. It is kept only in this browser and sent with each request.</p>
    <div id="keymsg"></div>
    <label for="adminkey">Admin key</label>
    <input class="field" type="password" id="adminkey" placeholder="paste ADMIN_KEY">
    <button class="btn primary" id="savekey">Continue</button>
  </div>

  <div id="panel" class="hide">
    <div class="card">
      <h2 style="margin-bottom:6px">Student doubts</h2>
      <p class="muted" style="font-family:var(--sans);font-size:.9rem">Doubts students submit from a lesson, grouped by topic. Mark one answered once you have replied on WhatsApp/Telegram.</p>
      <div class="doubts-bar">
        <label class="doubts-toggle"><input type="checkbox" id="newOnly" checked> Show unanswered only</label>
        <button class="btn ghost" id="refresh">Refresh</button>
      </div>
      <div id="doubtsWrap"><p class="muted">Loading&hellip;</p></div>
    </div>
  </div>

</main>

<footer class="site-footer">VicThree Defence &middot; Doubts</footer>

<script src="assets/portal.js"></script>
<script>
  var AK_KEY = "vt_admin_key";
  function adminKey(){ try { return localStorage.getItem(AK_KEY) || ""; } catch { return ""; } }
  function setAdminKey(k){ try { localStorage.setItem(AK_KEY, k); } catch {} }

  async function adminApi(path, opts){
    opts = opts || {};
    var headers = Object.assign({ "X-Admin-Key": adminKey() }, opts.headers || {});
    if (opts.body && typeof opts.body !== "string"){ headers["Content-Type"]="application/json"; opts.body=JSON.stringify(opts.body); }
    var res = await fetch(API + path, { method: opts.method||"GET", headers: headers, body: opts.body });
    var data=null; try{ data=await res.json(); }catch{}
    return { ok:res.ok, status:res.status, data:data };
  }
  function show(id, cls, text){ document.getElementById(id).innerHTML = text ? '<div class="msg '+cls+'">'+text+'</div>' : ''; }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function fmtWhen(ms){ try { return new Date(ms).toLocaleString("en-IN", { timeZone:"Asia/Kolkata", day:"numeric", month:"short", hour:"numeric", minute:"2-digit", hour12:true }); } catch { return ""; } }

  function enterPanel(){
    document.getElementById("keycard").classList.add("hide");
    document.getElementById("panel").classList.remove("hide");
    loadDoubts();
  }

  document.getElementById("savekey").addEventListener("click", async function(){
    var k = document.getElementById("adminkey").value.trim();
    if (!k){ show("keymsg","err","Enter your admin key."); return; }
    setAdminKey(k);
    var r = await adminApi("/api/admin/doubts?status=new");
    if (r.status === 403){ show("keymsg","err","That admin key was rejected."); return; }
    enterPanel();
  });
  document.getElementById("forget").addEventListener("click", function(){ try{localStorage.removeItem(AK_KEY);}catch{} location.reload(); });
  document.getElementById("newOnly").addEventListener("change", loadDoubts);
  document.getElementById("refresh").addEventListener("click", loadDoubts);

  async function resolve(id, toStatus, btn){
    btn.disabled = true;
    var r = await adminApi("/api/admin/doubt-resolve", { method:"POST", body:{ id:id, status:toStatus } });
    if (r.ok) loadDoubts(); else { btn.disabled = false; }
  }

  async function loadDoubts(){
    var wrap = document.getElementById("doubtsWrap");
    var newOnly = document.getElementById("newOnly").checked;
    wrap.innerHTML = '<p class="muted">Loading&hellip;</p>';
    var r = await adminApi("/api/admin/doubts" + (newOnly ? "?status=new" : ""));
    if (!r.ok){ wrap.innerHTML = '<p class="muted">Could not load doubts.</p>'; return; }
    var list = (r.data && r.data.doubts) || [];
    if (!list.length){ wrap.innerHTML = '<div class="empty-state"><h3>No doubts'+(newOnly?' waiting':'')+'</h3><p class="muted">'+(newOnly?'You are all caught up.':'Nothing here yet.')+'</p></div>'; return; }

    // group topic-wise
    var groups = {};
    list.forEach(function(d){
      var key = (d.day != null) ? ("Topic " + d.day + (d.topic ? (": " + d.topic) : "")) : "General";
      var sort = (d.day != null) ? d.day : 9999;
      if (!groups[key]) groups[key] = { sort: sort, items: [] };
      groups[key].items.push(d);
    });
    var keys = Object.keys(groups).sort(function(a,b){ return groups[a].sort - groups[b].sort; });

    wrap.innerHTML = "";
    keys.forEach(function(k){
      var g = groups[k];
      var sec = document.createElement("div"); sec.className = "doubt-group";
      var h = document.createElement("div"); h.className = "doubt-group-title";
      h.innerHTML = esc(k) + ' <span class="doubt-count">' + g.items.length + '</span>';
      sec.appendChild(h);
      g.items.forEach(function(d){
        var item = document.createElement("div"); item.className = "doubt-item" + (d.status === "resolved" ? " resolved" : "");
        var meta = document.createElement("div"); meta.className = "doubt-meta";
        meta.innerHTML = '<span class="doubt-who">' + esc(d.name || "Student") + '</span>' +
          '<span class="doubt-email">' + esc(d.email || "") + '</span>' +
          '<span class="doubt-time">' + esc(fmtWhen(d.created_at)) + '</span>';
        var body = document.createElement("p"); body.className = "doubt-text"; body.textContent = d.text || "";
        var row = document.createElement("div"); row.className = "doubt-row";
        var mail = document.createElement("a"); mail.className = "btn ghost sm"; mail.textContent = "Reply by email";
        mail.href = "mailto:" + encodeURIComponent(d.email || "") + "?subject=" + encodeURIComponent("Your doubt on " + k);
        var act = document.createElement("button"); act.className = "btn " + (d.status === "resolved" ? "ghost" : "primary") + " sm";
        act.textContent = d.status === "resolved" ? "Mark unanswered" : "Mark answered";
        act.addEventListener("click", function(){ resolve(d.id, d.status === "resolved" ? "new" : "resolved", act); });
        row.appendChild(mail); row.appendChild(act);
        item.appendChild(meta); item.appendChild(body); item.appendChild(row);
        sec.appendChild(item);
      });
      wrap.appendChild(sec);
    });
  }

  if (adminKey()) enterPanel();
</script>
</body>
</html>
