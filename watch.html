<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lesson | VicThree Defence</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="assets/shield-32.png">
<link rel="apple-touch-icon" href="assets/shield-180.png">
<meta name="theme-color" content="#0B1F3A">
<link rel="stylesheet" href="assets/portal.css">
<script src="https://cdn.jsdelivr.net/npm/player.js@0.1.0/dist/player.min.js"></script>
</head>
<body>

<header class="site-header">
  <div class="banner-wrap">
    <a href="dashboard.html" class="banner-link" aria-label="VicThree Defence"><img src="assets/banner.jpg" alt="VicThree Defence — by Anmol Sharma"></a>
    <a class="hdr-action" id="logout">Log out</a>
  </div>
</header>

<main class="wrap watch">
  <a class="back-link" href="dashboard.html#geography">&larr; Geography</a>
  <div id="topicEyebrow" style="font-size:12.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);margin-bottom:4px"></div>
  <h1 id="title">Lesson</h1>
  <div id="msg"></div>

  <div class="player" id="player">
    <div class="watermark" id="wm"></div>
    <iframe id="frame" allow="encrypted-media;fullscreen" allowfullscreen loading="lazy"></iframe>
  </div>

  <div class="watch-actions" id="actions"></div>

  <div class="doubt-box" id="doubtBox" hidden>
    <div class="doubt-head">Ask a doubt on this topic</div>
    <textarea id="doubtText" class="doubt-input" rows="4" placeholder="Type your doubt about this lesson. It reaches Anmol with the topic attached, and he will get back to you."></textarea>
    <div class="doubt-actions">
      <button class="btn primary" id="doubtSend">Send doubt</button>
      <span id="doubtMsg" class="doubt-msg"></span>
    </div>
  </div>
</main>

<footer class="site-footer">VicThree Defence · Course</footer>

<script src="assets/portal.js"></script>
<script>
  if (!requireLogin()) { /* redirected */ }
  document.getElementById("logout").addEventListener("click", logout);

  var day = parseInt(new URLSearchParams(location.search).get("day"), 10);
  var NOTES_ICON = '<span class="tab-ic"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 16h4"/></svg></span>';
  var TEST_ICON = '<span class="tab-ic"><svg viewBox="0 0 24 24"><path d="M9 4h6v2H9z"/><path d="M15 5h3v15a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V5h3"/><path d="M9 13l2 2 4-4"/></svg></span>';

  (async function(){
    // Watermark the player with the student's email (a screen-recording deterrent).
    var meRes = await api("/api/me");
    var product = (meRes && meRes.data && meRes.data.product) || "trial";
    if (meRes && meRes.data && meRes.data.email) document.getElementById("wm").textContent = meRes.data.email;

    if (!day) { fail("No lesson selected."); return; }
    var r = await api("/api/video?day=" + day);
    if (r && r.status === 403) {
      var when = (r.data && r.data.unlockAt) ? fmtUnlock(r.data.unlockAt) : "later";
      fail("This topic hasn't unlocked yet. It opens at " + when + ".");
      return;
    }
    if (!r || !r.ok || !r.data) { fail("This lesson could not be loaded."); return; }

    var d = r.data;
    document.getElementById("title").textContent = (window.TOPIC_NAMES && window.TOPIC_NAMES[day]) || d.title || ("Topic " + day);
    document.getElementById("topicEyebrow").textContent = "Topic " + day;

    if (d.embedUrl) {
      document.getElementById("frame").src = d.embedUrl;
      setupProgress(document.getElementById("frame"), product, day);
    } else {
      // Notes have opened but the video hasn't (before its 7 AM unlock).
      showVideoLocked(d.videoUnlockAt);
    }

    var actions = document.getElementById("actions");

    // Notes tab: active once notes have opened (6 PM the evening before).
    var notesReady = !!d.hasNotes && (d.notesUnlocked !== undefined ? !!d.notesUnlocked : true);
    var notesTab = document.createElement(notesReady ? "button" : "span");
    notesTab.className = "tab" + (notesReady ? "" : " tab-disabled");
    notesTab.innerHTML = NOTES_ICON + "Notes";
    if (notesReady) notesTab.addEventListener("click", function(){ openNotes(day); });
    else notesTab.title = d.hasNotes ? ("Notes open " + fmtUnlock(d.notesUnlockAt)) : "Notes for this topic will be added soon";
    actions.appendChild(notesTab);

    // Take the test tab: opens this topic's mock test on the mock-test site.
    var testUrl = (window.TOPIC_TESTS && window.TOPIC_TESTS[day]) || "";
    var testTab = document.createElement(testUrl ? "a" : "span");
    testTab.className = "tab primary" + (testUrl ? "" : " tab-disabled");
    testTab.innerHTML = TEST_ICON + "Take the test";
    if (testUrl) { testTab.href = (typeof ssbHandoff === "function" ? ssbHandoff(testUrl) : testUrl); testTab.target = "_blank"; testTab.rel = "noopener"; }
    else testTab.title = "The test for this topic will be added soon";
    actions.appendChild(testTab);

    // Ask a doubt tab (all enrolled students): reveals a form; the doubt is tagged with this topic.
    var DOUBT_ICON = '<span class="tab-ic"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/><path d="M8 9.5h8M8 12.5h5"/></svg></span>';
    var doubtTab = document.createElement("button");
    doubtTab.className = "tab";
    doubtTab.innerHTML = DOUBT_ICON + "Ask a doubt";
    doubtTab.addEventListener("click", function(){
      var box = document.getElementById("doubtBox");
      box.hidden = !box.hidden;
      if (!box.hidden) document.getElementById("doubtText").focus();
    });
    actions.appendChild(doubtTab);

    document.getElementById("doubtSend").addEventListener("click", async function(){
      var ta = document.getElementById("doubtText"), msg = document.getElementById("doubtMsg");
      var text = ta.value.trim();
      if (!text) { msg.className = "doubt-msg err"; msg.textContent = "Please type your doubt first."; return; }
      this.disabled = true; this.textContent = "Sending…";
      var r = await api("/api/doubt", { method: "POST", body: { day: day, text: text } });
      this.disabled = false; this.textContent = "Send doubt";
      if (r && r.ok) {
        ta.value = ""; msg.className = "doubt-msg ok"; msg.textContent = "Sent. Anmol will get back to you.";
        setTimeout(function(){ document.getElementById("doubtBox").hidden = true; msg.textContent = ""; }, 2500);
      } else { msg.className = "doubt-msg err"; msg.textContent = "Could not send. Please try again."; }
    });
  })();

  function fail(text){
    document.getElementById("player").classList.add("hide");
    document.getElementById("msg").innerHTML = '<div class="msg err">' + text + '</div>' +
      '<p><a class="btn ghost" href="dashboard.html#geography">Back to Geography</a></p>';
  }

  // Shown when notes have opened but the video hasn't yet (before its 7 AM unlock).
  function showVideoLocked(videoUnlockAt){
    document.getElementById("player").innerHTML =
      '<div class="video-locked">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>' +
      '<p class="vl-main">Today\'s notes are ready below.</p>' +
      '<p class="vl-sub">The video unlocks at ' + fmtUnlock(videoUnlockAt) + '.</p>' +
      '</div>';
  }

  // Mark this topic complete once the student watches past the halfway point (or finishes).
  function setupProgress(iframe, product, day){
    if (typeof playerjs === "undefined" || isWatched(product, day)) return;
    try {
      var player = new playerjs.Player(iframe);
      player.on("ready", function(){
        player.on("timeupdate", function(t){
          if (t && t.duration && (t.seconds / t.duration) >= 0.5) markWatched(product, day);
        });
        player.on("ended", function(){ markWatched(product, day); });
      });
    } catch (e) {}
  }
</script>
</body>
</html>
